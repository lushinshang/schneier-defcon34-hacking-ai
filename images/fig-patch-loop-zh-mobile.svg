<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" width="540" height="960" role="img" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<title>修補的速度</title>
<desc>本文歸納的概念示意：同一個起點「AI 找到漏洞」分成兩條線。軟體這條線：修補或轉成特徵碼，廠商發現漏洞可以直接修補。稅法這條線：要由立法機關修補，路上可能遇到更新要好幾年、漏洞根深蒂固補不掉兩個阻礙。不代表實際時間比例，不是影片畫面。</desc>
<!-- ANIM-BEGIN --><style>path[d^="M429.2"]{animation:chk 8s ease-in-out 1 both}@keyframes chk{0%{opacity:1}6%,25%{opacity:.25}32%,100%{opacity:1}}circle[cx="440"]{transform-box:fill-box;transform-origin:center;animation:pop 8s ease-in-out 1 both}@keyframes pop{0%,24%{transform:scale(1)}29%{transform:scale(1.12)}36%,100%{transform:scale(1)}}.swdot{animation:swdot 8s ease-in-out 1 both}@keyframes swdot{0%{opacity:0;transform:translateX(0px)}4%{opacity:.9;transform:translateX(0px)}25%,100%{opacity:.9;transform:translateX(20px)}}.taxdot{animation:taxdot 8s ease-in-out 1 both}@keyframes taxdot{0%{opacity:0;transform:translateY(0px)}5%{opacity:.9;transform:translateY(0px)}60%,100%{opacity:.9;transform:translateY(44px)}}@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style><!-- ANIM-END -->
<rect width="540" height="960" fill="#fbfaf7"/>
<text x="30" y="74" font-size="32" fill="#1d2433" font-weight="bold" text-anchor="start">修補的速度</text>
<rect x="150" y="100" width="240" height="80" rx="14" fill="#1d2433" stroke="none" stroke-width="0"/>
<text x="270" y="150" font-size="28" fill="#ffffff" font-weight="bold" text-anchor="middle">AI 找到漏洞</text>
<rect x="60" y="220" width="460" height="250" rx="14" fill="#e6f2ec" stroke="none" stroke-width="0"/>
<rect x="60" y="510" width="460" height="360" rx="14" fill="#f8e6e2" stroke="none" stroke-width="0"/>
<line x1="150" y1="140" x2="34" y2="140" stroke="#5b6170" stroke-width="3"/>
<line x1="34" y1="140" x2="34" y2="602" stroke="#5b6170" stroke-width="3"/>
<line x1="34" y1="312" x2="70" y2="312" stroke="#5b6170" stroke-width="3"/>
<path d="M68 304 L80 312 L68 320 Z" fill="#5b6170"/>
<line x1="34" y1="602" x2="70" y2="602" stroke="#5b6170" stroke-width="3"/>
<path d="M68 594 L80 602 L68 610 Z" fill="#5b6170"/>
<text x="80" y="264" font-size="26" fill="#2f7d5b" font-weight="bold" text-anchor="start">軟體</text>
<rect x="80" y="280" width="300" height="64" rx="10" fill="#ffffff" stroke="#2f7d5b" stroke-width="2.5"/>
<text x="230" y="322" font-size="26" fill="#1d2433" font-weight="bold" text-anchor="middle">修補或轉成特徵碼</text>
<line x1="380" y1="312" x2="402" y2="312" stroke="#2f7d5b" stroke-width="3"/>
<path d="M400 304 L412 312 L400 320 Z" fill="#2f7d5b"/>
<circle cx="440" cy="312" r="24" fill="#2f7d5b"/>
<path d="M429.2 312.5 L437.6 320.6 L452.0 303.8" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="394" font-size="24" fill="#5b6170" text-anchor="start">廠商發現漏洞可以直接修補</text>
<text x="80" y="554" font-size="26" fill="#a8402f" font-weight="bold" text-anchor="start">稅法</text>
<rect x="80" y="570" width="300" height="64" rx="10" fill="#ffffff" stroke="#a8402f" stroke-width="2.5"/>
<text x="230" y="612" font-size="26" fill="#1d2433" font-weight="bold" text-anchor="middle">要由立法機關修補</text>
<line x1="120" y1="634" x2="120" y2="850" stroke="#a8402f" stroke-width="3" stroke-dasharray="10 8"/>
<rect x="96" y="700" width="48" height="10" rx="2" fill="#a8402f" stroke="none" stroke-width="0"/>
<text x="160" y="714" font-size="24" fill="#a8402f" font-weight="bold" text-anchor="start">更新可能要好幾年</text>
<rect x="96" y="790" width="48" height="10" rx="2" fill="#a8402f" stroke="none" stroke-width="0"/>
<text x="160" y="804" font-size="24" fill="#a8402f" font-weight="bold" text-anchor="start">可能根深蒂固補不掉</text>
<text x="510" y="926" font-size="24" fill="#5b6170" text-anchor="end">本文歸納的概念示意</text>
<!-- ANIM-BEGIN --><circle class="swdot" cx="368" cy="312" r="7" fill="#2f7d5b" style="opacity:0"/><circle class="taxdot" cx="120" cy="644" r="7" fill="#a8402f" style="opacity:0"/><!-- ANIM-END -->
</svg>
