<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img">
<title>規則裡的縫</title>
<desc>抽象封面示意：細線組成的網格代表一套規則，網格上緣有一處很小的缺口。一個光點從左下角出發，沿著網格邊緣緩慢移動，找到缺口後穿進網格，再淡出、回到起點重來（週期約 12 秒）。靜態畫面是完整網格、光點停在起點。圖內沒有文字，不是影片畫面。</desc>
<style>.light{animation:light 12s linear infinite}@keyframes light{0%{transform:translate(0px,0px);opacity:1}2%{transform:translate(0px,0px);opacity:1}36.7%{transform:translate(624px,0px);opacity:1}52.7%{transform:translate(624px,-288px);opacity:1}64%{transform:translate(420.0px,-288px);opacity:1}67%{transform:translate(420.0px,-288px);opacity:1}74%{transform:translate(420.0px,-216px);opacity:1}84%{transform:translate(420.0px,-187px);opacity:0}85%{transform:translate(0px,0px);opacity:0}100%{transform:translate(0px,0px);opacity:1}}.halo{animation:halo 12s ease-in-out infinite}@keyframes halo{0%,61%{opacity:0}67%{opacity:.9}76%{opacity:.5}88%,100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
